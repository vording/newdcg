<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DCG プロトタイプ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <strong>DCG プロトタイプ</strong> <small id="build" class="muted"></small>
    <label>対戦形式
      <select id="mode">
        <option value="cpu">CPU対戦（あなた＝プレイヤー1）</option>
        <option value="hotseat">2人対戦（同じ画面）</option>
      </select>
    </label>
    <button id="newGame">新しいゲーム</button>
  </header>
  <main>
    <section id="table"><p id="boot">ゲームを読み込んでいます…（この表示が消えない場合は、ページを再読み込みしてください）</p></section>
    <aside>
      <h3>ログ</h3>
      <ol id="log"></ol>
    </aside>
  </main>
  <script type="module" src="ui.js"></script>
</body>
</html>
